title = "Headless TLU secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "The web18 attachment WordPress meta key is not an API credential"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^docs/wordpress/wpcode-web18-import\.php$''']
regexes = ['''^[[:space:]]*'meta_key'[[:space:]]*=>[[:space:]]*'_web18_attachment_id',[[:space:]]*'meta_value'[[:space:]]*=>''']
