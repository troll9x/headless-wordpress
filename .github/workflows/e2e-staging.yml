name: Staging browser regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_BASE_URL: https://dev.nguyenhongson.vn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: university-next/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix university-next
      - name: Install browser
        working-directory: university-next
        run: npx playwright install --with-deps chromium
      - name: Run read-only public site checks
        working-directory: university-next
        run: npm run test:e2e
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-e2e-traces
          path: university-next/test-results/
          retention-days: 7
